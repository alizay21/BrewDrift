name: brewdrift
description: "Find your vibe. Find your café. — Brewdrift is a premium café discovery and personal journal app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # HTTP
  dio: ^5.7.0

  # Secure storage (Android Keystore-backed)
  flutter_secure_storage: ^9.2.2

  # Navigation
  go_router: ^14.6.2

  # Maps & Location
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # Images
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^3.0.0

  # Animations
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0

  # Typography
  google_fonts: ^6.2.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.4
  connectivity_plus: ^6.1.4
  url_launcher: ^6.3.1
  flutter_dotenv: ^5.2.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  freezed: ^3.0.0
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.5
  mocktail: ^1.0.4
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.5

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - .env


